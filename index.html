<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2&family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="styles.css"> 
  <title>Rock Paper Scissors Game - Choose Your Theme</title>
</head>

<body>
  <main>
    <select id="theme-switcher">
      <option value="default">🖤 Default</option>
      <option value="cotton">🧁 Cotton Candy</option>
      <option value="space">🌌 Space</option>
      <option value="retro">🎮 Retro Neon</option>
    </select>
    <button id="theme-submit">Apply Theme</button>
    
    <div class="intro-text">
      <p>Choose your weapon and see if you can beat the computer!</p>
      <p>Click the button to play!</p>
      <p>Made with ❤️ by Cameron</p>  
    </div>
    <div id="scoreboard">
      <div class="score user">
        <span class="label"></span>
        <span id="user-score" class="value">0</span>
      </div><br>
      <div class="score computer">
        <span class="label"></span>
        <span id="computer-score" class="value">0</span>
      </div><br>
      <div class="score draw">
        <span class="label"></span>
        <span id="draw-score" class="value">0</span>
      </div><br>
      <div class="score rounds">
        <span class="label"></span>
        <span id="rounds-played" class="value">0</span>
      </div><br>
    </div>
    
     <div class="form-container">
      <form id="rps-form">
        <h2>Rock Paper Scissors</h2>
        <label for="user-choice">Choose your weapon:</label>
        <select id="user-choice" name="user-choice">
          <option value="rock">Rock 🪨</option>
          <option value="paper">Paper 📃</option>
          <option value="scissors">Scissors ✂️</option>
        </select>
        <button type="submit">Play! 🎮</button>
      </form>
    </div>
    <div id="result-message"></div>
  </main>

  <script src="custom.js"></script>

</body>

</html>
